version: "3.7"
services:
  neo4j:
    image: neo4j:4.4
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  bloodhound:
    image: specterops/bloodhound # Updated image name
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASS=password
    ports:
      - "7475:7475"
    depends_on:
      - neo4j

volumes:
  neo4j_data:

